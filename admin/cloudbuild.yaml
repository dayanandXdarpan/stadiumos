# ── StadiumOS Admin — Cloud Build Configuration ───────────────────────────
# Builds and deploys the Next.js admin dashboard to Cloud Run.
# The backend Cloud Run URL is injected as a build-time ARG so it's baked
# into the Next.js static bundle.
#
# Required Cloud Build substitution variables:
#   _REGION          e.g. us-central1
#   _BACKEND_URL     e.g. https://stadiumos-backend-xxxxxx-uc.a.run.app
#   _BACKEND_WS_URL  e.g. wss://stadiumos-backend-xxxxxx-uc.a.run.app/ws
#   _API_TOKEN       Bearer token matching backend API_TOKEN env var
# ─────────────────────────────────────────────────────────────────────────

steps:
  # Step 1: Build Docker image with NEXT_PUBLIC_ vars baked in
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-admin'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stadiumos-admin:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stadiumos-admin:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_BACKEND_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_WS_URL=${_BACKEND_WS_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_TOKEN=${_API_TOKEN}'
      - '.'
    dir: 'admin'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-admin'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stadiumos-admin:$COMMIT_SHA'
    waitFor: ['build-admin']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-admin'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'stadiumos-admin'
      - '--image=gcr.io/$PROJECT_ID/stadiumos-admin:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
    waitFor: ['push-admin']

substitutions:
  _REGION: 'us-central1'
  _BACKEND_URL: 'http://localhost:8000'
  _BACKEND_WS_URL: 'ws://localhost:8000/ws'
  _API_TOKEN: 'stadiumos-demo-token'

images:
  - 'gcr.io/$PROJECT_ID/stadiumos-admin:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/stadiumos-admin:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
