name: stadiumos_fan
description: StadiumOS Fan Navigation & Alert App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  web_socket_channel: ^3.0.0
  camera: ^0.11.0
  permission_handler: ^11.3.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  # video_player removed — unused dependency

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ── Launcher Icon Configuration ────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: false
  image_path: 'assets/images/app_icon.png'
  # If assets/images/app_icon.png doesn't exist, the default Flutter icon is used.
  # Generate it with: flutter pub run flutter_launcher_icons

# ── Native Splash Screen ──────────────────────────────────────────────────
flutter_native_splash:
  color: '#0a0f1e'
  android: true
  ios: false
